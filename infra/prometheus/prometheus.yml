# Scrape de todos los procesos. dns_sd: si se escala un servicio (`--scale relay=3`),
# Docker devuelve una IP por réplica y Prometheus las descubre todas.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics/
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000

  - job_name: relay
    dns_sd_configs:
      - names: [relay]
        type: A
        port: 9100

  - job_name: workers
    dns_sd_configs:
      - names: [worker-email, worker-sms, worker-push]
        type: A
        port: 9100

  - job_name: dlq
    dns_sd_configs:
      - names: [dlq-archiver]
        type: A
        port: 9100
